esentations of v1.5.8 as its subject. There are no luminous lines, decorative particles or arbitrary motion. Rotate a coefficient window, inspect a rational norm-one family, or unfold a value into its f tree.',aboutTypes:'L embeds additively and in order into M; it is not a field. M is Q[ε], and Fε corresponds to Q(ε). Cε has two coefficient slots over Fε; Hε has four. Neither is the complete classical system over R. Higher windows show additional ε coefficients, rather than a new number algebra.',aboutLens:'An infinitesimal cannot be faithfully drawn at a fixed real pixel distance. The formal lens therefore changes the chosen power of ε as you zoom. A label states the exact formal scale; Euclidean spacing within that window is a drawing convention. Natural numbers and integers stay discrete, and rational zoom stays rational.',aboutConstants:'√2 is σ=(0,1) in the independent extension T, not in Fε. π is the separate rational-cut description of Appendix B. e is an additional interval illustration, absent from the manuscript. The shared number line is an external comparison chart; it does not define mixed arithmetic between these types.',aboutSources:'Sources: A_New_Foundation_of_Mathematics_en_v1.5.8.md, §§2.6, 3–8, 8.10, 9.4 and Appendix B; and the entrance examples of A_New_Foundation_of_Mathematics_en_v1.5.8_f_only.md. This visualization is an interpretation, not machine verification of the manuscript.',aboutFinite:'Only finite samples and finite computations are shown. All constant bounds are computed with exact BigInt rational arithmetic. Displayed decimals and screen coordinates are approximations. Save this HTML and open it offline in a modern browser.',saved:'Image saved',noFull:'Fullscreen is unavailable here',count:'vertices',actual:'Exact rational bounds',lower:'Lower',upper:'Upper',width:'Width',bound:'≤ 2⁻ᵖ',external:'External comparison · distinct exact types',intervals:'Nested rational intervals',sqrtDesc:'The positive σ in T satisfies σ²=2. Rational bisection bounds its location. Its exact finite-pair representation does not change as precision increases.',piDesc:'πcut is specified by two rational membership rules in Appendix B. The finite Leibniz recurrence encloses it; no finite endpoint is the exact π.',eDesc:'Additional illustration, outside v1.5.8: sum 1/k! through n. For n≥1, the positive remainder is at most 1/(n·n!). These intervals enclose conventional e in external analysis.',sqrtSampling:'Exact bisection starting at [1,2], retaining endpoints with l²≤2≤u².',piSampling:'A₀=4, B₀=8/3; Aₘ₊₁=Aₘ−8/((4m+3)(4m+5)), Bₘ₊₁=Bₘ+8/((4m+5)(4m+7)). Stage m=2ᵖ.',eSampling:'Sₙ=Σₖ₌₀ⁿ1/k!; interval [Sₙ,Sₙ+1/(n·n!)], n≥1. Increase n until width≤2⁻ᵖ. This is not an adopted construction in v1.5.8.',sqrtTitle:'Adjoining √2',piTitle:'A cut for π',eTitle:'An interval for e',rationalLine:'Rational comparison line',intervalLens:'Interval magnification',comparisonNote:'The plotted constant label uses an external decimal approximation. The bracket endpoints are exact rationals.',empty:'Only the origin remains at this scale',coefficient:'coefficient slots',torus:'Rational torus section',circle:'Rational unit circle',noRoot:'No √2 in Fε',window:'finite coefficient window',normNote:'N(h)=1; radii 3/5 and 4/5. A rational torus family inside the four-dimensional norm-one locus, not the whole locus.',circleNote:'Rational parametrization ((1−t²)/(1+t²), 2t/(1+t²)), including the missing point (−1,0).',gridNote:'Finite rational coefficient samples. M shows polynomials; Fε shows a Laurent-polynomial subfamily, not all polynomial ratios.',treeNote:'Exact f-only encoding of the selected finite value, with the matrix representation retained for generative complex coefficients.',stages:[['Natural numbers','A base, then one more constructor. The nonnegative integer points preserve their discrete spacing.','Finite N sample, embedded along a single axis.'],['Signed integers','A sign paired with a magnitude. Zero has its normalized positive sign.','Finite Z sample, embedded along a single axis.'],['Rational numbers','Normalized pairs of integers. Refining denominators reveals further rational positions.','Reduced fractions with bounded denominators. Tick height records denominator, not a second number coordinate.'],['Relation labels','A rational component and an integer relation count. Under the embedding, (k,a) becomes a+kε.','Finite (k,a) sample. The two axes separate the components of lexicographic order.'],['M-polynomials','Finite rational coefficient lists. Their positions encode successive powers of ε.','A finite coefficient lattice in Q[ε]; the window degree is chosen for this view.'],['Finite rational expressions','Ratios of M-polynomials with nonzero denominators. ε⁻¹ adds a direction larger than every positive rational.','A Laurent-polynomial coefficient window inside Q(ε). The full field also contains other polynomial ratios.'],['Generative complex numbers','J(a,b) retains the two-by-two matrix construction, with a,b in Fε and i²=−1.','Two coefficient slots over Fε. Higher windows include further powers of ε in each slot.'],['Generative quaternions','Pairs of generative complex numbers. Four coefficients; multiplication remembers its order: ij=k, ji=−k.','Four coefficient slots over Fε. The displayed finite rational family is embedded in these slots.']]},
ja:{eyebrow:'有限の構成 / 無限の方向',title:'fによる生成のアトラス',about:'この図について',light:'ライト',dark:'ダーク',reset:'表示を戻す',representation:'表現',projection:'投影フレーム',density:'標本の密度',higher:'高次平面の回転',precision:'精度の要求 · p',motion:'操作',rotate:'自動回転',constants:'定数の位置を見る',reading:'この表示の読み方',example:'符号化した例：',source:'本文とfのみの付録に基づく · v1.5.8',gestures:'ドラッグで回転 · Shift／2本指で移動 · ホイール／ピンチでズーム · Alt＋ドラッグで高次回転',edges:'線',axes:'軸',export:'画像を保存',close:'閉じる',grid:'係数の窓',norm:'ノルム1の断面',tree:'fの構成木',construction:'構成',sample:'有限標本',frame:'投影フレーム',depth:'形式的なレンズ',rationalScale:'有理数の縮尺',spatial:'空間の拡大率',treeDepth:'構成の深さ',nodes:'節点',projectionNote:'座標は数値的に投影しています。線は標本点を結ぶもので、線分上の全実数点がこの型に属するという主張ではありません。投影の次元と代数的な次元は別です。',lensQ:'原点を中心として10の冪で有理数の格子を細分します。有限標本を生成し直しており、完成した連続体を描画するものではありません。',lensN:'原点が焦点です。離散的な型では原点の近くに新たな非零点がないため、深く拡大すると原点以外は見えなくなります。',lensL:'第2の座標はLの整数の関係数を分離する模式表示です。この間隔は順序を保つユークリッド距離ではありません。Lにはε²方向はありません。',lensE:'ズームに連動して、隣接する形式的な窓εᵏとεᵏ⁺¹が連続的にフェードイン・アウトします。εに実数の大きさは割り当てません。窓ごとに有限の係数標本を作り、深さに既定の上限は設けません。',lensTree:'各節点は子を0・1・2個持つ実際のf構成子です。配置座標は模式的であり、拡大しても節点は増えません。',aboutTitle:'美しさは、構成の中に。',aboutBody:'v1.5.8の有限表現そのものを題材にしたアトラスです。発光する線、装飾的な粒子、恣意的な動きは加えていません。係数の窓を回転し、有理係数のノルム1の族を眺め、値をfの木に展開できます。',aboutTypes:'LからMへの埋め込みは加法と順序を保ちますが、Lは体ではありません。MはQ[ε]、FεはQ(ε)に対応します。CεはFε上の係数2個、Hεは4個を持ち、古典的な実数係数の全体系とは区別されます。高次の窓はεの係数を増やして表示するもので、新たな数の代数を導入しません。',aboutLens:'無限小を固定された実数の画素距離で忠実に描くことはできません。このため拡大に応じて選ぶεの冪を変更します。形式的な縮尺は明記し、窓の内部の間隔は描画上の約束とします。自然数・整数は離散的に、有理数のズームは有理数のまま扱います。',aboutConstants:'√2は独立な拡大Tのσ=(0,1)で、Fεには属しません。πは付録Bの独立な有理切断です。eは本文にない追加の区間表示例です。共通の数直線は外部的な比較図であり、これらの型の混合演算を定めるものではありません。',aboutSources:'出典：英語本文v1.5.8の§§2.6、3–8、8.10、9.4、付録Bと、英語fのみの付録の入口の例。可視化としての解釈であり、本文の機械検証ではありません。',aboutFinite:'表示するのは有限標本と有限計算です。定数の区間端点はBigIntによる厳密な有理数計算で求めます。小数と画面座標は近似です。このHTMLは保存して現代的なブラウザでオフラインで開けます。',saved:'画像を保存しました',noFull:'ここでは全画面表示を使用できません',count:'頂点',actual:'厳密な有理数の区間',lower:'下端',upper:'上端',width:'幅',bound:'≤ 2⁻ᵖ',external:'外部的な比較 · 厳密な型はそれぞれ異なる',intervals:'入れ子の有理区間',sqrtDesc:'Tの正の元σはσ²=2を満たします。有理数の二分法でその位置を囲みます。精度を増しても厳密な有限対の表現は変わりません。',piDesc:'πcutは付録Bの2つの有理数の所属規則で指定されます。有限のライプニッツ漸化式で囲みますが、有限段階の端点は厳密なπではありません。',eDesc:'v1.5.8の範囲外の追加例：1/k!をnまで加えます。n≥1で正の剰余は1/(n·n!)以下です。外部の解析における通常のeを囲みます。',sqrtSampling:'[1,2]から始める厳密な二分法で、l²≤2≤u²を満たす端点を保ちます。',piSampling:'A₀=4、B₀=8/3。Aₘ₊₁=Aₘ−8/((4m+3)(4m+5))、Bₘ₊₁=Bₘ+8/((4m+5)(4m+7))。段階m=2ᵖ。',eSampling:'Sₙ=Σₖ₌₀ⁿ1/k!、区間[Sₙ,Sₙ+1/(n·n!)]（n≥1）。幅≤2⁻ᵖまでnを増やします。v1.5.8で採用された構成ではありません。',sqrtTitle:'√2を添加する',piTitle:'πの切断',eTitle:'eの区間',rationalLine:'有理数による比較の数直線',intervalLens:'区間の拡大率',comparisonNote:'定数のラベル位置は外部的な小数近似です。括弧の端点は厳密な有理数です。',empty:'この縮尺では原点のみ',coefficient:'係数の座標',torus:'有理係数のトーラス断面',circle:'有理係数の単位円',noRoot:'Fεには√2はない',window:'有限の係数の窓',normNote:'N(h)=1、半径は3/5と4/5。4次元のノルム1の軌跡に含まれる有理係数のトーラス族であり、軌跡全体ではありません。',circleNote:'有理パラメータ表示((1−t²)/(1+t²), 2t/(1+t²))に、欠ける点(−1,0)を追加します。',gridNote:'有限の有理係数の標本です。Mは多項式、Fεはローラン多項式の部分族であり、あらゆる多項式の比を尽くしません。',treeNote:'生成複素数の行列表現を保ち、選んだ有限の値を厳密にfのみへ符号化しています。',stages:[['自然数','基底から構成子を1つずつ加えます。非負整数の点は離散的な間隔を保ちます。','単一の軸に配置したNの有限標本。'],['符号付き整数','符号と大きさの対。ゼロの符号は正側に正規化されます。','単一の軸に配置したZの有限標本。'],['有理数','正規化された整数の対。分母を細分すると、さらに有理数の位置が現れます。','分母を有限に制限した既約分数。目盛りの高さは分母を示し、第2の数の座標ではありません。'],['関係ラベル','有理成分と整数の関係数。(k,a)は埋め込みでa+kεとなります。','有限の(k,a)標本。辞書式順序の2つの成分を別の軸で表示します。'],['M多項式','有理係数の有限列。列の位置がεの各冪を符号化します。','Q[ε]の有限の係数格子。表示に応じて窓の次数を選びます。'],['有限有理式数','非零の分母を持つM多項式の比。ε⁻¹はあらゆる正の有理数より大きな方向を加えます。','Q(ε)に含まれるローラン多項式の係数窓。体全体には他の多項式の比も含まれます。'],['生成複素数','J(a,b)は2×2の行列構成を保ち、a,bはFεの元、i²=−1です。','Fε上の係数2個。高次の窓では各係数に含まれるεの冪をさらに表示します。'],['生成四元数','生成複素数の対。4つの係数と、順序を区別する積：ij=k、ji=−k。','Fε上の係数4個。表示する有限の有理係数の族は、その座標への埋め込みです。']]},
fr:{eyebrow:'Construction finie / directions infinies',title:'L’atlas f-génératif',about:'Notes',light:'Clair',dark:'Sombre',reset:'Réinitialiser',representation:'Représentation',projection:'Cadre de projection',density:'Densité',higher:'Rotation dans un plan supérieur',precision:'Précision demandée · p',motion:'Explorer',rotate:'Rotation auto',constants:'Situer une constante',reading:'Lire cette vue',example:'Exemple encodé :',source:'D’après le manuscrit et l’annexe en f seul · v1.5.8',gestures:'Glisser : rotation · Maj / deux doigts : déplacement · Molette / pincement : zoom · Alt-glisser : plans supérieurs',edges:'Lignes',axes:'Axes',export:'Enregistrer l’image',close:'Fermer',grid:'Fenêtre de coefficients',norm:'Section de norme unité',tree:'Construction en f',construction:'Construction',sample:'échantillon fini',frame:'cadre de projection',depth:'Lentille formelle',rationalScale:'Échelle rationnelle',spatial:'Grossissement spatial',treeDepth:'Profondeur',nodes:'nœuds',projectionNote:'Projection numérique des coordonnées. Les lignes relient des sommets échantillonnés ; elles ne supposent pas que tout segment réel appartient au type. Dimension de projection et dimension algébrique sont distinctes.',lensQ:'Le zoom affine une grille rationnelle autour de zéro par puissances de 10. Les échantillons sont régénérés ; aucun continuum achevé n’est affiché.',lensN:'L’origine est le centre. Ces types discrets n’ont aucun nouveau point non nul plus proche de zéro ; le zoom profond devient vide.',lensL:'Le second axe sépare les comptes entiers de L. Cet espacement est schématique, sans métrique euclidienne préservant l’ordre. L n’a pas de direction ε².',lensE:'Les fenêtres formelles voisines εᵏ et εᵏ⁺¹ apparaissent et disparaissent progressivement avec le zoom. Aucune grandeur réelle n’est attribuée à ε. Chaque fenêtre est un nouvel échantillon fini, sans limite de profondeur prédéfinie.',lensTree:'Chaque nœud est un constructeur f avec zéro, un ou deux enfants. La disposition est schématique ; le zoom ne crée aucun nœud.',aboutTitle:'La beauté est dans la construction.',aboutBody:'Cet atlas explore les représentations finies de v1.5.8. Ni lignes lumineuses, ni particules décoratives, ni mouvement arbitraire. Faites tourner une fenêtre de coefficients, observez une famille rationnelle de norme unité ou dépliez une valeur en arbre f.',aboutTypes:'L s’injecte dans M en préservant l’addition et l’ordre ; L n’est pas un corps. M correspond à Q[ε] et Fε à Q(ε). Cε possède deux coefficients sur Fε et Hε quatre. Ce ne sont pas les systèmes classiques complets sur R. Les fenêtres supérieures montrent davantage de coefficients en ε, sans créer une nouvelle algèbre.',aboutLens:'Un infinitésimal ne peut pas être fidèlement représenté à une distance réelle fixe en pixels. La lentille change donc la puissance de ε observée. L’échelle formelle est explicite ; l’espacement euclidien est une convention. Les entiers restent discrets ; le zoom rationnel reste rationnel.',aboutConstants:'√2 est σ=(0,1) dans l’extension indépendante T, pas dans Fε. π est la coupure rationnelle de l’annexe B. e est une illustration ajoutée, absente du manuscrit. La droite commune sert de comparaison externe et ne définit pas d’arithmétique mixte.',aboutSources:'Sources : manuscrit anglais v1.5.8, §§2.6, 3–8, 8.10, 9.4, annexe B ; exemples d’entrée de l’annexe anglaise en f seul. Cette visualisation est une interprétation, pas une vérification machine du manuscrit.',aboutFinite:'Seuls des échantillons et calculs finis sont affichés. Les bornes sont calculées exactement avec des rationnels BigInt. Décimales et coordonnées à l’écran sont approchées. Ce HTML fonctionne hors ligne dans un navigateur moderne.',saved:'Image enregistrée',noFull:'Plein écran indisponible ici',count:'sommets',actual:'Bornes rationnelles exactes',lower:'Borne inférieure',upper:'Borne supérieure',width:'Largeur',bound:'≤ 2⁻ᵖ',external:'Comparaison externe · types exacts distincts',intervals:'Interva iers signés','Un signe associé à une grandeur. Le zéro est normalisé du côté positif.','Échantillon fini de Z sur un axe.'],['Nombres rationnels','Paires normalisées d’entiers. Des dénominateurs plus fins révèlent d’autres positions.','Fractions réduites à dénominateurs bornés. La hauteur du trait indique le dénominateur, pas une seconde coordonnée.'],['Étiquettes de relation','Une composante rationnelle et un compte entier. (k,a) s’injecte comme a+kε.','Échantillon fini (k,a) séparant les composantes de l’ordre lexicographique.'],['M-polynômes','Listes finies de coefficients rationnels ; leur position encode les puissances de ε.','Grille finie dans Q[ε] ; le degré de la fenêtre dépend de la vue.'],['Expressions rationnelles finies','Fractions de M-polynômes à dénominateur non nul. ε⁻¹ dépasse tout rationnel positif.','Fenêtre de polynômes de Laurent dans Q(ε), sans épuiser le corps.'],['Complexes génératifs','J(a,b) conserve la construction matricielle 2×2, avec a,b dans Fε et i²=−1.','Deux coefficients sur Fε ; les fenêtres supérieures ajoutent des puissances de ε.'],['Quaternions génératifs','Paires de complexes génératifs. Quatre coefficients ; ij=k et ji=−k.','Quatre coefficients sur Fε, contenant la famille rationnelle finie affichée.']]},

function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t;}return a;}

function interval(kind,p){

}

function nat(n){let x=base();for(let i=0;i<n;i++)x=[x];return x;}

// Each LOD owns a fixed scale origin. Both its opacity and its position remain

function zoomLayers(stage,shape,zoom){
 if(shape==='tree'||stage<2)return [{level:0,scale:Math.exp(Math.min(700,zoom)),opacity:1}];
 const unit=stage===2?Math.LN10:Math.log(5);
 if((stage===3||stage===4)&&zoom<=0)return [{level:0,scale:Math.exp(zoom),opacity:1}];
 const position=zoom/unit,level=Math.floor(position),mix=smoothstep(0,1,position-level);

  {level,scale:Math.exp(zoom-level*unit),opacity:1-mix},
  {level:level+1,scale:Math.exp(zoom-(level+1)*unit),opacity:mix}
 ];
}

// Native OS select popups can keep mouse tracking outside the page after a
// choice. Use document-owned listboxes instead of relying on blur timing.
function syncSelectControls(){for(const control of selectControls.values())control.sync();}
function enhanceSelects(){
 let opened=null;
 function closeMenu(){if(!opened)return;opened.close();opened=null;}
 for(const select of document.querySelectorAll('select')){
  const trigger=document.createElement('button'),menu=document.createElement('div');
  trigger.type='button';trigger.id=select.id+'-trigger';trigger.className='select-trigger';
  trigger.setAttribute('role','combobox');trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');
  menu.id=select.id+'-listbox';menu.className='select-menu';menu.setAttribute('role','listbox');menu.hidden=true;
  trigger.setAttribute('aria-controls',menu.id);
  const label=document.querySelector('label[for="'+select.id+'"]');
  if(label){label.id=select.id+'-label';label.htmlFor=trigger.id;trigger.setAttribute('aria-labelledby',label.id);menu.setAttribute('aria-labelledby',label.id);}
  else{const name=select.getAttribute('aria-label');trigger.setAttribute('aria-label',name);menu.setAttribute('aria-label',name);}
  select.hidden=true;select.tabIndex=-1;select.insertAdjacentElement('afterend',trigger);document.body.append(menu);
  let active=0,options=[],search='',searchTime=0;
  const control={
   close(){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.removeAttribute('aria-activedescendant');},
   sync(){
    trigger.disabled=select.disabled;trigger.textContent=select.selectedOptions[0]?.textContent||'';
    if(!menu.hidden){closeMenu();}
   }
  };
  selectControls.set(select.id,control);
  function highlight(index){
   active=Math.max(0,Math.min(options.length-1,index));
   [...menu.children].forEach((el,i)=>el.dataset.active=String(i===active));
   const item=menu.children[active];if(item){trigger.setAttribute('aria-activedescendant',item.id);item.scrollIntoView({block:'nearest'});}
  }
  function openMenu(){
   closeMenu();options=[...select.options];
   menu.replaceChildren(...options.map((option,i)=>{
    const item=document.createElement('div');item.id=menu.id+'-'+i;item.className='select-option';item.setAttribute('role','option');
    item.setAttribute('aria-selected',String(option.selected));item.textContent=option.textContent;
    item.addEventListener('pointerdown',e=>{if(e.button===0)e.preventDefault();});
    item.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')highlight(i);});
    item.addEventListener('click',e=>commit(i,e.detail===0));return item;
   }));
   const r=trigger.getBoundingClientRect(),width=Math.min(Math.max(r.width,96),window.innerWidth-16);
   const height=Math.min(240,options.length*34+10,window.innerHeight-16);
   menu.style.width=width+'px';menu.style.maxHeight=height+'px';
   menu.style.left=Math.max(8,Math.min(r.left,window.innerWidth-width-8))+'px';
   menu.style.top=Math.max(8,r.bottom+height+4>window.innerHeight?r.top-height-4:r.bottom+4)+'px';
   menu.hidden=false;opened=control;trigger.setAttribute('aria-expanded','true');search='';
   highlight(select.selectedIndex);
  }
  function commit(index,keyboard){
   if(!options[index]||options[index].disabled)return;
   const value=options[index].value;closeMenu();
   if(select.value!==value){select.value=value;select.dispatchEvent(new Event('change',{bubbles:true}));}
   control.sync();
   if(keyboard)trigger.focus({preventScroll:true});else canvas.focus({preventScroll:true});
  }
  trigger.addEventListener('click',()=>{if(menu.hidden)openMenu();else closeMenu();});
  trigger.addEventListener('keydown',e=>{
   if(e.key==='Tab'){closeMenu();return;}
   if(e.key==='Escape'){closeMenu();e.preventDefault();return;}
   if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    e.preventDefault();const wasClosed=menu.hidden;if(wasClosed)openMenu();
    if(e.key==='Home')highlight(0);else if(e.key==='End')highlight(options.length-1);else if(!wasClosed)highlight(active+(e.key==='ArrowDown'?1:-1));return;
   }
   if(e.key==='Enter'||e.key===' '){e.preventDefault();if(menu.hidden)openMenu();else commit(active,true);return;}
   if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    e.preventDefault();if(menu.hidden)openMenu();const now=performance.now();search=now-searchTime<700?search+e.key:e.key;searchTime=now;
    const index=options.findIndex(o=>o.textContent.toLocaleLowerCase().startsWith(search.toLocaleLowerCase()));if(index>=0)highlight(index);
   }
  });
  trigger.addEventListener('blur',()=>{if(opened===control)closeMenu();});control.sync();
 }
 document.addEventListener('pointerdown',e=>{if(opened&&!e.target.closest('.select-trigger,.select-menu'))closeMenu();},true);
 document.addEventListener('scroll',e=>{if(opened&&!e.target.closest?.('.select-menu'))closeMenu();},true);
 window.addEventListener('resize',closeMenu);window.addEventListener('blur',closeMenu);
}
enhanceSelects();

new ResizeObserver(()=>{resize();requestDraw();}).observe($('viewport'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestDraw();});
rebuild();updateUI();readPalette();resize();requestDraw();

window.AtlasMath=Object.freeze({rat,add,sub,mul,div,cmp,rstr,rnum,interval,encode,countTree,EXAMPLES,rationalCircle,zoomLayers,advanceZoom});
</script>
